<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduSync | Gestión Escolar</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo-container">
            <img src="logo.jpg" alt="EduSync Logo" class="app-logo" style="height: 50px;">
        </div>
        <h1>EduSync</h1>
        <p>Gestión Escolar y Horarios - UTU</p>
        <div id="auth-container">
            <button id="btn-login-open">Iniciar Sesión</button>
            <button id="btn-register-open">Registrarse</button>
        </div>
    </header>

    <main class="dashboard">
        <section class="card">
            <h2>Cuadrilla de Horarios y Cursos</h2>
            <div class="search-box">
                <input type="text" id="search-input" placeholder="Buscar materia o curso...">
                <button id="btn-search">Buscar</button>
            </div>
            <div id="schedule-results"></div>
        </section>

        <section class="card" id="news-section">
            <h2>Noticias y Avisos Institucionales</h2>
            <div id="news-container"></div>
        </section>

        <section class="card" id="chatbot-section">
            <h2>Asistente Virtual (Chatbot)</h2>
            <div id="chat-messages"></div>
            <div class="chat-input-box">
                <input type="text" id="chat-input" placeholder="Escribe tu consulta...">
                <button id="btn-send-chat">Enviar</button>
            </div>
        </section>
    </main>

    <!-- Modal de Autenticación / Registro -->
    <div id="auth-modal" class="modal">
        <div class="modal-content">
            <div style="text-align: center;">
                <img src="logo.jpg" alt="Logo" style="height: 40px; margin-bottom: 10px;">
            </div>
            <span class="close-modal">&times;</span>
            <h2 id="modal-title">Registro en EduSync</h2>
            <form id="auth-form">
                <div id="name-field" class="form-group">
                    <label>Nombre completo</label>
                    <input type="text" id="reg-name" placeholder="Tu nombre">
                </div>
                <div class="form-group">
                    <label>Correo electrónico</label>
                    <input type="email" id="reg-email" placeholder="correo@ejemplo.com" required>
                </div>
                <div class="form-group">
                    <label>Contraseña</label>
                    <input type="password" id="reg-password" placeholder="••••••••••" required>
                </div>
                <div id="role-field" class="form-group">
                    <label>Rol</label>
                    <select id="reg-role">
                        <option value="alumno">Alumno</option>
                        <option value="profesor">Profesor</option>
                        <option value="admin">Administrador</option>
                    </select>
                </div>
                <div id="code-field" class="form-group" style="display: none;">
                    <label>Código especial de rol</label>
                    <input type="password" id="reg-code" placeholder="Código de acceso">
                </div>
                <button type="submit" id="modal-submit-btn" class="btn-primary">Crear Cuenta</button>
            </form>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
