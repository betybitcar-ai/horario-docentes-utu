<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Horario Docentes</title><link rel="stylesheet" href="style.css"></head><body><header><b>📚 Horario Docentes</b><nav id="nav"></nav></header><main>
<section id="login"><div class="card auth"><h1>Iniciar sesión</h1><input id="le" type="email" placeholder="Correo electrónico"><input id="lp" type="password" placeholder="Contraseña"><button onclick="login()">Entrar</button><p>¿No tienes cuenta? <button class="link" onclick="show('reg')">Crear cuenta</button></p><p id="lm"></p></div></section>
<section id="reg" class="hidden"><div class="card auth"><h1>Crear usuario</h1><input id="rn" placeholder="Nombre completo"><input id="re" type="email" placeholder="Correo electrónico"><input id="rp" type="password" placeholder="Contraseña"><select id="rr" onchange="code()"><option value="alumno">Alumno</option><option value="profesor">Profesor</option><option value="admin">Administrador</option></select><input id="rc" class="hidden" placeholder="Código especial"><button onclick="register()">Registrarme</button><button class="secondary" onclick="show('login')">Volver</button><p id="rm"></p></div></section>
<section id="app" class="hidden"><h1>Panel de control</h1><p id="welcome"></p><div id="content" class="grid"></div></section></main><script src="app.js"></script></body></html>
