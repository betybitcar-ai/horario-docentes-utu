<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EduSync - Gestión Académica</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  
  <style>
    body {
      background-color: #f8f9fa;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    /* Contenedor flotante para el Robot 3D (Oculto inicialmente) */
    .robot-3d-container {
      position: fixed;
      bottom: 20px;
      right: 20px;
      width: 90px;
      height: 90px;
      border-radius: 50%;
      cursor: pointer;
      z-index: 1000;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
      background: white;
      overflow: hidden;
      transition: transform 0.3s ease;
      display: none;
    }

    .robot-3d-container:hover {
      transform: scale(1.1);
    }

    .robot-3d-container.pensando {
      box-shadow: 0 0 20px #0dcaf0, 0 0 30px #0d6efd;
      animation: pulsoPensando 1s infinite alternate;
    }

    @keyframes pulsoPensando {
      0% { transform: scale(1); }
      100% { transform: scale(1.08); }
    }

    .chatbot-container {
      position: fixed;
      bottom: 125px;
      right: 25px;
      width: 360px;
      height: 480px;
      background: white;
      border-radius: 15px;
      box-shadow: 0 8px 25px rgba(0,0,0,0.25);
      display: none;
      flex-direction: column;
      z-index: 1000;
      overflow: hidden;
      border: 1px solid #dee2e6;
    }

    .chatbot-container.active {
      display: flex;
    }

    .chat-messages {
      flex: 1;
      padding: 12px;
      overflow-y: auto;
      font-size: 14px;
      background-color: #fdfdfe;
    }
  </style>
</head>
<body>

  <!-- Barra de Navegación Institucional -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm px-4">
    <div class="container-fluid">
      <a class="navbar-brand fw-bold d-flex align-items-center" href="#">
        🎓 <span class="ms-2">EduSync <small class="fs-6 fw-normal text-light opacity-75">| Gestión Escolar</small></span>
      </a>
      <div class="d-flex align-items-center">
        <span id="userInfo" class="text-light me-3 small fw-semibold"></span>
        <button class="btn btn-outline-light btn-sm d-none" id="logoutBtn" onclick="logoutUser()">Cerrar Sesión</button>
      </div>
    </div>
  </nav>

  <!-- Contenido Principal: Panel de Inicio de Sesión / Dashboard -->
  <div class="container my-5">
    <div id="mainContentArea">
      <!-- Tarjeta de Login Centrada -->
      <div class="row justify-content-center">
        <div class="col-md-5">
          <div class="card shadow-sm border-0 p-4 rounded-4 bg-white">
            <h3 class="text-center mb-4 fw-bold text-dark">Iniciar Sesión</h3>
            
            <div class="mb-3">
              <label class="form-label small fw-semibold">Correo electrónico</label>
              <input type="email" id="loginEmail" class="form-control" placeholder="correo@ejemplo.com">
            </div>
            <div class="mb-3">
              <label class="form-label small fw-semibold">Contraseña</label>
              <input type="password" id="loginPassword" class="form-control" placeholder="********">
            </div>
            <button onclick="loginUser()" class="btn btn-primary w-100 py-2 fw-semibold mb-3">Ingresar</button>
            <div class="text-center">
              <small class="text-muted">¿No tienes cuenta? <a href="#" data-bs-toggle="modal" data-bs-target="#registerModal" class="text-decoration-none">Regístrate</a></small>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Robot 3D flotante (Exclusivo para Profesores y Administradores) -->
  <div class="robot-3d-container" id="robotWrapper" onclick="toggleChat()" title="Asistente Virtual 3D">
    <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.48/build/spline-viewer.js"></script>
    <spline-viewer url="https://prod.spline.design/6Wq1Q7YGyq-iicqP/scene.splinecode" style="width: 100%; height: 100%; pointer-events: none;"></spline-viewer>
  </div>

  <!-- Ventana de Chat del Asistente -->
  <div class="chatbot-container" id="chatContainer">
    <div class="bg-primary text-white p-3 d-flex justify-content-between align-items-center">
      <h6 class="m-0 fw-bold">🤖 Asistente EduSync 3D</h6>
      <button onclick="toggleChat()" class="btn btn-sm btn-outline-light border-0">✕</button>
    </div>
    
    <div id="chatMessages" class="chat-messages">
      <div class="mb-2 p-2 bg-light rounded text-dark">
        <b>🤖 Bot:</b> ¡Hola! Asistente activo para consultas de cursos y horarios institucionales.
      </div>
    </div>

    <div class="p-2 border-top bg-white d-flex">
      <input type="text" id="chatInput" class="form-control form-control-sm me-2" placeholder="Escribe tu consulta..." onkeypress="handleKeyPress(event)">
      <button onclick="sendMessage()" class="btn btn-primary btn-sm">Enviar</button>
    </div>
  </div>

  <!-- Modal de Registro -->
  <div class="modal fade" id="registerModal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog">
      <div class="modal-content">
        <div class="modal-header bg-primary text-white">
          <h5 class="modal-title">Registro en EduSync</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body">
          <div class="mb-2">
            <label class="form-label small">Nombre completo</label>
            <input type="text" id="regName" class="form-control form-control-sm">
          </div>
          <div class="mb-2">
            <label class="form-label small">Correo electrónico</label>
            <input type="email" id="regEmail" class="form-control form-control-sm">
          </div>
          <div class="mb-2">
            <label class="form-label small">Contraseña</label>
            <input type="password" id="regPassword" class="form-control form-control-sm">
          </div>
          <div class="mb-2">
            <label class="form-label small">Rol</label>
            <select id="regRole" class="form-select form-select-sm" onchange="toggleRoleCode()">
              <option value="alumno">Alumno</option>
              <option value="profesor">Profesor</option>
              <option value="admin">Administrador</option>
            </select>
          </div>
          <div class="mb-3 d-none" id="codeContainer">
            <label class="form-label small text-danger">Código especial de rol</label>
            <input type="text" id="regCode" class="form-control form-control-sm" placeholder="PROFE-2026 o ADMIN-2026">
          </div>
          <button onclick="registerUser()" class="btn btn-success w-100 btn-sm mt-2">Crear Cuenta</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    window.addEventListener('DOMContentLoaded', async () => {
      try {
        const res = await fetch('/api/me');
        const user = await res.json();
        
        const robotWrapper = document.getElementById('robotWrapper');
        const chatContainer = document.getElementById('chatContainer');
        const logoutBtn = document.getElementById('logoutBtn');
        const mainArea = document.getElementById('mainContentArea');

        if (user && user.name) {
          document.getElementById('userInfo').innerText = `Hola, ${user.name} (${user.role})`;
          logoutBtn.classList.remove('d-none');
          
          // Cambiar vista principal si ya está logueado
          mainArea.innerHTML = `
            <div class="p-5 bg-white rounded-3 shadow-sm border">
              <h1 class="display-5 fw-bold text-primary">Bienvenido, ${user.name}</h1>
              <p class="col-md-8 fs-4 text-muted">Panel activo para control de cursos, horarios de 3º BT Tecnologías de la Información y asistencia inteligente.</p>
            </div>
          `;

          if (user.role === 'profesor' || user.role === 'admin') {
            robotWrapper.style.display = 'block';
          } else {
            robotWrapper.style.display = 'none';
          }
        } else {
          robotWrapper.style.display = 'none';
        }
      } catch (e) {
        console.error("Sesión no iniciada");
      }
    });

    function toggleRoleCode() {
      const role = document.getElementById('regRole').value;
      const codeContainer = document.getElementById('codeContainer');
      if (role === 'profesor' || role === 'admin') {
        codeContainer.classList.remove('d-none');
      } else {
        codeContainer.classList.add('d-none');
      }
    }

    async function loginUser() {
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, password })
      });
      const data = await res.json();
      if (data.success) {
        location.reload();
      } else {
        alert(data.error || "Error al iniciar sesión");
      }
    }

    async function registerUser() {
      const name = document.getElementById('regName').value;
      const email = document.getElementById('regEmail').value;
      const password = document.getElementById('regPassword').value;
      const role = document.getElementById('regRole').value;
      const code = document.getElementById('regCode').value;

      const res = await fetch('/api/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, email, password, role, code })
      });
      const data = await res.json();
      if (data.success) {
        location.reload();
      } else {
        alert(data.error || "Error al registrarse");
      }
    }

    async function logoutUser() {
      await fetch('/api/logout', { method: 'POST' });
      location.reload();
    }

    function toggleChat() {
      const chat = document.getElementById('chatContainer');
      chat.classList.toggle('active');
    }

    function handleKeyPress(event) {
      if (event.key === 'Enter') {
        sendMessage();
      }
    }

    async function sendMessage() {
      const input = document.getElementById('chatInput');
      const messages = document.getElementById('chatMessages');
      const robotBtn = document.getElementById('robotWrapper');
      const text = input.value.trim();
      
      if (!text) return;

      messages.innerHTML += `<div class="mb-2 p-2 bg-primary-subtle rounded text-end"><b>Tú:</b> ${text}</div>`;
      input.value = '';
      messages.scrollTop = messages.scrollHeight;

      robotBtn.classList.add('pensando');

      try {
        const res = await fetch('/api/chatbot', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ message: text })
        });
        
        const data = await res.json();
        const reply = data.answer || data.error || "No se obtuvo respuesta del servidor.";
        
        messages.innerHTML += `<div class="mb-2 p-2 bg-light rounded text-dark"><b>🤖 Bot:</b><br>${markdownToHtml(reply)}</div>`;
        messages.scrollTop = messages.scrollHeight;
      } catch (e) {
        messages.innerHTML += `<div class="mb-2 p-2 bg-danger-subtle rounded text-danger"><b>Error:</b> No se pudo conectar con el asistente.</div>`;
      } finally {
        robotBtn.classList.remove('pensando');
      }
    }

    function markdownToHtml(text) {
      return text
        .replace(/\n/g, '<br>')
        .replace(/\*\*(.*?)\*\*/g, '<b>$1</b>');
    }
  </script>
</body>
</html>
